<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign In — Executive Reporting Platform</title>
<meta name="description" content="Sign in to the CEO Operating System™ — the executive reporting platform powered by Aligned KPIs™." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="apple-touch-icon" href="assets/logo-app-icon-light.svg" />
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin: 0; padding: 0; height: 100%; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  img,svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }

  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --ink-2: #424245;
    --muted: #6e6e73;
    --line: rgba(0,0,0,0.08);
    --accent: #0a84ff;
    --radius-lg: 28px;
    --radius-md: 18px;
    --shadow-2: 0 2px 6px rgba(0,0,0,0.06), 0 30px 60px -20px rgba(0,0,0,0.18);
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
    --font-text:    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  }

  body {
    font-family: var(--font-text);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    display: flex; flex-direction: column;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: absolute; inset: -10% -10% auto -10%; height: 70%;
    background:
      radial-gradient(40% 60% at 20% 30%, rgba(10,132,255,0.16), transparent 60%),
      radial-gradient(50% 60% at 80% 10%, rgba(94,92,230,0.18), transparent 60%);
    filter: blur(20px);
    pointer-events: none;
  }

  .card-logo { display: block; margin: 2px auto 26px; }
  .card-logo img { width: 100%; max-width: 300px; height: auto; margin: 0 auto; }

  main {
    position: relative; z-index: 1;
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .card {
    width: min(420px, 100%);
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
    padding: clamp(32px, 5vw, 48px);
    text-align: center;
  }
  .product-mark {
    width: 56px; height: 56px; border-radius: 16px;
    margin: 0 auto 18px;
    background:
      radial-gradient(120% 120% at 0% 0%, #7aa7ff 0%, transparent 55%),
      radial-gradient(120% 120% at 100% 100%, #b388ff 0%, transparent 55%),
      linear-gradient(135deg, #0a84ff, #5e5ce6 60%, #ff2d92);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4), 0 10px 24px rgba(10,132,255,0.35);
  }
  h1 {
    font-family: var(--font-display);
    font-size: 24px; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }

  form { text-align: left; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--ink-2); }
  input {
    width: 100%; font: inherit;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.15);
    background: #fafafc;
    margin-bottom: 16px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,0.15); }
  button {
    width: 100%; font: inherit; cursor: pointer;
    padding: 13px 0;
    border: 0; border-radius: 999px;
    background: var(--ink); color: #fff;
    font-weight: 500; font-size: 15px;
    transition: transform .2s ease, background .2s ease;
  }
  button:hover { background: #000; transform: translateY(-1px); }

  .notice {
    display: none;
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(10,132,255,0.08);
    color: var(--ink-2);
    font-size: 14px;
    text-align: left;
  }
  .notice a { color: var(--accent); font-weight: 500; }

  .links { margin-top: 22px; font-size: 13px; color: var(--muted); }
  .links a:hover { color: var(--ink); }

  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 24px;
    font-size: 12px; color: var(--muted);
  }
</style>
</head>
<body>

<main>
  <div class="card">
    <a href="index.html" class="card-logo" aria-label="CEO Operating System — Align Your Team. Accelerate Growth.">
      <img src="assets/executive-reporting-platform-logo.svg" alt="CEO Operating System™ — Align Your Team. Accelerate Growth." />
    </a>
    <h1>Sign in</h1>
    <p class="sub">Access your executive dashboard.</p>

    <form id="login-form" autocomplete="off">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />

      <button type="submit">Sign In</button>
    </form>

    <div class="notice" id="notice">
      Customer logins are coming soon. If you're an existing client and need
      access to your dashboards, <a href="contact.html">contact us</a> and
      we'll get you set up.
    </div>

    <div class="links">
      <a href="index.html">&larr; Back to AlignedKPIs.com</a>
    </div>
  </div>
</main>

<footer>
  © <span id="yr"></span> 1 to 100 Advisors, Inc. &middot; CEO Operating System&trade;
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('notice').style.display = 'block';
  });
</script>

</body>
</html>
