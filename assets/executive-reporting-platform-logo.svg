<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 185" role="img" aria-label="Executive Reporting Platform — Chamber Edition by 1 to 100 Advisors, Inc.">
  <defs>
    <linearGradient id="erp-bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f9ad6"/>
      <stop offset="1" stop-color="#16314f"/>
    </linearGradient>
  </defs>

  <!-- Brand mark: alignment arcs + KPI bars + growth arrow -->
  <g transform="translate(8, 12)">
    <path d="M 130.2 32.7 A 70 70 0 0 0 24.2 113.9"
          fill="none" stroke="#16314f" stroke-width="13" stroke-linecap="round"/>
    <path d="M 49.8 147.3 A 70 70 0 0 0 155.8 66.1"
          fill="none" stroke="#2178c4" stroke-width="13" stroke-linecap="round"/>
    <g>
      <rect x="56"  y="92" width="15" height="28" rx="2" fill="#4aa3e0"/>
      <rect x="77"  y="72" width="15" height="48" rx="2" fill="#2e86c9"/>
      <rect x="98"  y="50" width="15" height="70" rx="2" fill="url(#erp-bars)"/>
      <rect x="119" y="30" width="15" height="90" rx="2" fill="#16314f"/>
    </g>
    <path d="M 34 132 C 72 124 108 100 142 52"
          fill="none" stroke="#6fb52c" stroke-width="12" stroke-linecap="round"/>
    <path d="M 160 24 L 128 38 L 147 55 Z" fill="#6fb52c"/>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="205" y="92" font-size="52" font-weight="700" fill="#16314f">Executive</text>
    <text x="472" y="92" font-size="52" font-weight="700" fill="#2178c4">Reporting</text>
    <text x="752" y="92" font-size="52" font-weight="700" fill="#16314f">Platform</text>
    <line x1="207" y1="113" x2="975" y2="113" stroke="#cdd5e0" stroke-width="2"/>
    <text x="207" y="151" font-size="25" font-weight="500" letter-spacing="0.3" fill="#6e6e73">Chamber Edition &#8226; by 1 to 100 Advisors, Inc.</text>
  </g>
</svg>
