<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1740" role="img" aria-label="Aligned KPIs — one unified decision platform for CEOs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <radialGradient id="hub" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#2f6aa6"/>
      <stop offset="55%" stop-color="#1d456e"/>
      <stop offset="100%" stop-color="#13314f"/>
    </radialGradient>
    <linearGradient id="hubBars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7cc0ef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="growthLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aa3e0"/>
      <stop offset="1" stop-color="#6fb52c"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16314f" flood-opacity="0.10"/>
    </filter>
    <filter id="hubShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#13314f" flood-opacity="0.30"/>
    </filter>
    <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="700" height="1740" fill="url(#bg)"/>

  <!-- ===== Title ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="350" y="74" font-size="36" font-weight="700" fill="#13314f" letter-spacing="-0.5">Aligned KPIs<tspan font-size="18" dy="-12">&#8482;</tspan></text>
    <text x="350" y="112" font-size="19" font-weight="400" fill="#6e6e73">One unified decision platform for CEOs</text>
  </g>

  <!-- ===== Inputs caption ===== -->
  <text x="350" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2178c4" letter-spacing="1.5">CONNECTED DATA &amp; INTELLIGENCE</text>

  <!-- ===== Input cards (2 x 3 grid) ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <!-- Row 1 -->
    <g>
      <rect x="40" y="210" width="290" height="74" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="78" cy="247" r="13" fill="#eaf3fb"/><circle cx="78" cy="247" r="5" fill="#2178c4"/>
      <text x="104" y="253" font-size="19" font-weight="600" fill="#13314f">Marketing Tools</text>
    </g>
    <g>
      <rect x="370" y="210" width="290" height="74" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="408" cy="247" r="13" fill="#eaf3fb"/><circle cx="408" cy="247" r="5" fill="#2178c4"/>
      <text x="434" y="253" font-size="19" font-weight="600" fill="#13314f">CRM / Membership</text>
    </g>
    <!-- Row 2 -->
    <g>
      <rect x="40" y="304" width="290" height="74" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="78" cy="341" r="13" fill="#eaf3fb"/><circle cx="78" cy="341" r="5" fill="#2178c4"/>
      <text x="104" y="347" font-size="19" font-weight="600" fill="#13314f">Accounting Systems</text>
    </g>
    <g>
      <rect x="370" y="304" width="290" height="74" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="408" cy="341" r="13" fill="#eaf3fb"/><circle cx="408" cy="341" r="5" fill="#2178c4"/>
      <text x="434" y="347" font-size="19" font-weight="600" fill="#13314f">Financials &amp; Forecasts</text>
    </g>
    <!-- Row 3 -->
    <g>
      <rect x="40" y="398" width="290" height="74" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="78" cy="435" r="13" fill="#eaf3fb"/><circle cx="78" cy="435" r="5" fill="#2178c4"/>
      <text x="104" y="441" font-size="19" font-weight="600" fill="#13314f">Industry Insights</text>
    </g>
    <g>
      <rect x="370" y="398" width="290" height="74" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="408" cy="435" r="13" fill="#eaf3fb"/><circle cx="408" cy="435" r="5" fill="#2178c4"/>
      <text x="434" y="441" font-size="19" font-weight="600" fill="#13314f">Executive Advisors</text>
    </g>
  </g>

  <!-- ===== Arrow into hub ===== -->
  <g>
    <line x1="350" y1="482" x2="350" y2="548" stroke="#2178c4" stroke-width="4" stroke-linecap="round"/>
    <path d="M336 543 L350 566 L364 543 Z" fill="#2178c4"/>
  </g>

  <!-- ===== Central hub ===== -->
  <g>
    <circle cx="350" cy="720" r="120" fill="url(#hub)" filter="url(#hubShadow)"/>
    <circle cx="350" cy="720" r="120" fill="none" stroke="#5fb0ef" stroke-width="2.5" opacity="0.9" filter="url(#ringGlow)"/>
    <circle cx="350" cy="720" r="109" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

    <!-- Brand mark -->
    <g transform="translate(274.6,614.5) scale(0.82)">
      <path d="M 130.2 32.7 A 70 70 0 0 0 24.2 113.9" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <path d="M 49.8 147.3 A 70 70 0 0 0 155.8 66.1" fill="none" stroke="#5fb0ef" stroke-width="13" stroke-linecap="round"/>
      <rect x="56"  y="92" width="15" height="28" rx="2" fill="#9fd0f3"/>
      <rect x="77"  y="72" width="15" height="48" rx="2" fill="#bfe0f7"/>
      <rect x="98"  y="50" width="15" height="70" rx="2" fill="url(#hubBars)"/>
      <rect x="119" y="30" width="15" height="90" rx="2" fill="#ffffff"/>
      <path d="M 34 132 C 72 124 108 100 142 52" fill="none" stroke="#6fb52c" stroke-width="12" stroke-linecap="round"/>
      <path d="M 160 24 L 128 38 L 147 55 Z" fill="#6fb52c"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" fill="#ffffff">
      <text x="350" y="782" font-size="23" font-weight="700">CEO Operating</text>
      <text x="350" y="810" font-size="23" font-weight="700">System<tspan font-size="13" dy="-9">&#8482;</tspan></text>
    </g>
  </g>

  <!-- ===== Hub -> framework arrow ===== -->
  <g>
    <line x1="350" y1="842" x2="350" y2="902" stroke="#2178c4" stroke-width="4" stroke-linecap="round"/>
    <path d="M336 897 L350 920 L364 897 Z" fill="#2178c4"/>
  </g>

  <!-- ===== Framework caption ===== -->
  <text x="350" y="968" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#6fb52c" letter-spacing="1.5">THE PATH TO GROWTH</text>

  <!-- ===== Framework stages (stacked) ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <!-- Visibility -->
    <g>
      <rect x="70" y="1000" width="560" height="108" rx="18" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <rect x="70" y="1000" width="9" height="108" rx="4.5" fill="#4aa3e0"/>
      <text x="110" y="1052" font-size="26" font-weight="700" fill="#13314f">Visibility</text>
      <text x="110" y="1083" font-size="17" font-weight="400" fill="#6e6e73">Live KPIs &amp; executive dashboards</text>
    </g>
    <path d="M336 1113 L350 1133 L364 1113 Z" fill="#4aa3e0"/>
    <!-- Insights -->
    <g>
      <rect x="70" y="1145" width="560" height="108" rx="18" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <rect x="70" y="1145" width="9" height="108" rx="4.5" fill="#2e86c9"/>
      <text x="110" y="1197" font-size="26" font-weight="700" fill="#13314f">Insights</text>
      <text x="110" y="1228" font-size="17" font-weight="400" fill="#6e6e73">Profitability &amp; retention analysis</text>
    </g>
    <path d="M336 1258 L350 1278 L364 1258 Z" fill="#2e86c9"/>
    <!-- Execution -->
    <g>
      <rect x="70" y="1290" width="560" height="108" rx="18" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <rect x="70" y="1290" width="9" height="108" rx="4.5" fill="#2178c4"/>
      <text x="110" y="1342" font-size="26" font-weight="700" fill="#13314f">Execution</text>
      <text x="110" y="1373" font-size="17" font-weight="400" fill="#6e6e73">Goal tracking &amp; accountability</text>
    </g>
    <path d="M336 1403 L350 1423 L364 1403 Z" fill="#2178c4"/>
    <!-- Growth -->
    <g>
      <rect x="70" y="1435" width="560" height="108" rx="18" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <rect x="70" y="1435" width="9" height="108" rx="4.5" fill="#6fb52c"/>
      <text x="110" y="1487" font-size="26" font-weight="700" fill="#13314f">Growth</text>
      <text x="110" y="1518" font-size="17" font-weight="400" fill="#6e6e73">Revenue, retention &amp; profit acceleration</text>
    </g>
  </g>

  <!-- ===== Tagline ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="350" y="1625" font-size="32" font-weight="700" fill="#13314f" letter-spacing="-0.5">Align Your Team.</text>
    <text x="350" y="1667" font-size="32" font-weight="700" fill="#13314f" letter-spacing="-0.5">Accelerate Growth.</text>
    <rect x="240" y="1688" width="220" height="4" rx="2" fill="url(#growthLine)"/>
    <text x="350" y="1726" font-size="16" font-weight="500" fill="#6e6e73">Aligned KPIs&#8482; &#183; 1 to 100 Advisors, Inc.</text>
  </g>
</svg>
