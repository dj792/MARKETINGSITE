<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="akMarkTitle">
  <title id="akMarkTitle">Aligned KPIs mark — flywheel of continual progress, four pillars, growth trend</title>

  <!-- Flywheel: two equal 147° arcs, openings at the lower left (entry) and
       upper right (exit) so progress reads as continuous, not closed. -->
  <g id="ak-flywheel" fill="none" stroke-width="13" stroke-linecap="round">
    <path id="ak-flywheel-navy" d="M 40.55 153.53 A 80 80 0 0 1 120.71 22.73" stroke="#16314F"/>
    <path id="ak-flywheel-blue" d="M 165.53 54.11 A 80 80 0 0 1 70.03 174.17" stroke="#2178C4"/>
  </g>

  <!-- Four pillars: Visibility · Intelligence · Alignment · Better Results.
       Heights accelerate (33 / 45 / 61 / 84) to track the climb of the trend. -->
  <g id="ak-pillars">
    <rect class="ak-pillar" data-pillar="visibility"      x="53.5"  y="115" width="18" height="33" rx="3" fill="#9BC2E4"/>
    <rect class="ak-pillar" data-pillar="intelligence"    x="78.5"  y="103" width="18" height="45" rx="3" fill="#64A1D5"/>
    <rect class="ak-pillar" data-pillar="alignment"       x="103.5" y="87"  width="18" height="61" rx="3" fill="#2178C4"/>
    <rect class="ak-pillar" data-pillar="better-results"  x="128.5" y="64"  width="18" height="84" rx="3" fill="#16314F"/>
  </g>

  <!-- Growth trend: enters at -22°, climbs smoothly to -52° at the exit, holding
       a constant ~6.4px above every pillar.
       The plane has no lower wing — the line's underside runs unbroken into the
       nose as the keel, with one wing swept back above it. The keel is the exact
       tangent continuation of the trend line's lower edge at its endpoint, so the
       two meet with no kink. In the plane's own frame (nose forward, origin at the
       line's endpoint) it is simply: M 20 4.5 L -20 -17.5 L -8 4.5 Z -->
  <g id="ak-trend" fill="#6FB52C">
    <path id="ak-trend-line" d="M 40 110 C 88.21 90.52, 117.22 69.4, 148 30"
          fill="none" stroke="#6FB52C" stroke-width="9" stroke-linecap="round"/>
    <path id="ak-trend-plane" d="M 163.86 17.01 L 121.9 34.99 L 146.62 39.07 Z"/>
  </g>
</svg>
