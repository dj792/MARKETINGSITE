<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 180" role="img" aria-label="Aligned KPIs">
  <defs>
    <linearGradient id="akpi-bars-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fc0ff"/>
      <stop offset="1" stop-color="#b7c0cf"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g>
    <!-- Arc (top / left) -->
    <path d="M 130.2 32.7 A 70 70 0 0 0 24.2 113.9"
          fill="none" stroke="#b7c0cf" stroke-width="13" stroke-linecap="round"/>
    <!-- Blue arc (bottom / right) -->
    <path d="M 49.8 147.3 A 70 70 0 0 0 155.8 66.1"
          fill="none" stroke="#5aa9e6" stroke-width="13" stroke-linecap="round"/>
    <!-- Bars -->
    <g>
      <rect x="56"  y="92" width="15" height="28" rx="2" fill="#6fc0ff"/>
      <rect x="77"  y="72" width="15" height="48" rx="2" fill="#5aa9e6"/>
      <rect x="98"  y="50" width="15" height="70" rx="2" fill="url(#akpi-bars-dark)"/>
      <rect x="119" y="30" width="15" height="90" rx="2" fill="#b7c0cf"/>
    </g>
    <!-- Green growth arrow -->
    <path d="M 34 132 C 72 124 108 100 142 52"
          fill="none" stroke="#76c043" stroke-width="12" stroke-linecap="round"/>
    <path d="M 160 24 L 128 38 L 147 55 Z" fill="#76c043"/>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700">
    <text x="190" y="83" font-size="62" fill="#ffffff">Aligned</text>
    <text x="190" y="152" font-size="62" fill="#6fc0ff">KPIs</text>
    <text x="334" y="122" font-size="26" fill="#6fc0ff">&#8482;</text>
  </g>
</svg>
