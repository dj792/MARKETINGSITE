<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" role="img" aria-label="Aligned KPIs — one unified decision platform for CEOs">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <!-- Hub orb -->
    <radialGradient id="hub" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#2f6aa6"/>
      <stop offset="55%" stop-color="#1d456e"/>
      <stop offset="100%" stop-color="#13314f"/>
    </radialGradient>
    <linearGradient id="hubBars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7cc0ef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="connector" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc4e6"/>
      <stop offset="1" stop-color="#2178c4"/>
    </linearGradient>
    <linearGradient id="growthLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aa3e0"/>
      <stop offset="1" stop-color="#6fb52c"/>
    </linearGradient>
    <!-- Soft card shadow -->
    <filter id="card" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#16314f" flood-opacity="0.10"/>
    </filter>
    <filter id="hubShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#13314f" flood-opacity="0.30"/>
    </filter>
    <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1180" fill="url(#bg)"/>

  <!-- ===== Title ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="800" y="92" font-size="54" font-weight="700" fill="#13314f" letter-spacing="-0.5">Aligned KPIs<tspan font-size="26" dy="-18">&#8482;</tspan></text>
    <text x="800" y="138" font-size="25" font-weight="400" fill="#6e6e73">One unified decision platform for CEOs</text>
  </g>

  <!-- ===== Inputs caption ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="800" y="210" font-size="16" font-weight="700" fill="#2178c4" letter-spacing="1.5">CONNECTED DATA &amp; INTELLIGENCE</text>
  </g>

  <!-- ===== Connectors (drawn first, behind cards & hub) ===== -->
  <g fill="none" stroke="url(#connector)" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <path d="M152.5 332 C152.5 410, 693 395, 693 455"/>
    <path d="M411.5 332 C411.5 410, 730 364, 730 424"/>
    <path d="M670.5 332 C670.5 410, 776 347, 776 407"/>
    <path d="M929.5 332 C929.5 410, 824 347, 824 407"/>
    <path d="M1188.5 332 C1188.5 410, 870 364, 870 424"/>
    <path d="M1447.5 332 C1447.5 410, 907 395, 907 455"/>
  </g>
  <g fill="#2178c4">
    <circle cx="152.5" cy="332" r="4"/>
    <circle cx="411.5" cy="332" r="4"/>
    <circle cx="670.5" cy="332" r="4"/>
    <circle cx="929.5" cy="332" r="4"/>
    <circle cx="1188.5" cy="332" r="4"/>
    <circle cx="1447.5" cy="332" r="4"/>
  </g>

  <!-- ===== Input cards ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <!-- card template: x width 205, y 250, h 78 -->
    <g>
      <rect x="50" y="250" width="205" height="78" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="86" cy="289" r="13" fill="#eaf3fb"/><circle cx="86" cy="289" r="5" fill="#2178c4"/>
      <text x="112" y="284" font-size="17" font-weight="600" fill="#13314f">Marketing</text>
      <text x="112" y="305" font-size="17" font-weight="600" fill="#13314f">Tools</text>
    </g>
    <g>
      <rect x="309" y="250" width="205" height="78" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="345" cy="289" r="13" fill="#eaf3fb"/><circle cx="345" cy="289" r="5" fill="#2178c4"/>
      <text x="371" y="284" font-size="17" font-weight="600" fill="#13314f">CRM /</text>
      <text x="371" y="305" font-size="17" font-weight="600" fill="#13314f">Membership</text>
    </g>
    <g>
      <rect x="568" y="250" width="205" height="78" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="604" cy="289" r="13" fill="#eaf3fb"/><circle cx="604" cy="289" r="5" fill="#2178c4"/>
      <text x="630" y="284" font-size="17" font-weight="600" fill="#13314f">Accounting</text>
      <text x="630" y="305" font-size="17" font-weight="600" fill="#13314f">Systems</text>
    </g>
    <g>
      <rect x="827" y="250" width="205" height="78" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="863" cy="289" r="13" fill="#eaf3fb"/><circle cx="863" cy="289" r="5" fill="#2178c4"/>
      <text x="889" y="284" font-size="17" font-weight="600" fill="#13314f">Financials &amp;</text>
      <text x="889" y="305" font-size="17" font-weight="600" fill="#13314f">Forecasts</text>
    </g>
    <g>
      <rect x="1086" y="250" width="205" height="78" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="1122" cy="289" r="13" fill="#eaf3fb"/><circle cx="1122" cy="289" r="5" fill="#2178c4"/>
      <text x="1148" y="284" font-size="17" font-weight="600" fill="#13314f">Industry</text>
      <text x="1148" y="305" font-size="17" font-weight="600" fill="#13314f">Insights</text>
    </g>
    <g>
      <rect x="1345" y="250" width="205" height="78" rx="16" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <circle cx="1381" cy="289" r="13" fill="#eaf3fb"/><circle cx="1381" cy="289" r="5" fill="#2178c4"/>
      <text x="1407" y="284" font-size="17" font-weight="600" fill="#13314f">Executive</text>
      <text x="1407" y="305" font-size="17" font-weight="600" fill="#13314f">Advisors</text>
    </g>
  </g>

  <!-- ===== Central hub ===== -->
  <g>
    <circle cx="800" cy="545" r="140" fill="url(#hub)" filter="url(#hubShadow)"/>
    <circle cx="800" cy="545" r="140" fill="none" stroke="#5fb0ef" stroke-width="2.5" opacity="0.9" filter="url(#ringGlow)"/>
    <circle cx="800" cy="545" r="128" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

    <!-- Brand mark: alignment arcs + KPI bars + growth arrow -->
    <g transform="translate(719,424) scale(0.88)">
      <path d="M 130.2 32.7 A 70 70 0 0 0 24.2 113.9" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <path d="M 49.8 147.3 A 70 70 0 0 0 155.8 66.1" fill="none" stroke="#5fb0ef" stroke-width="13" stroke-linecap="round"/>
      <rect x="56"  y="92" width="15" height="28" rx="2" fill="#9fd0f3"/>
      <rect x="77"  y="72" width="15" height="48" rx="2" fill="#bfe0f7"/>
      <rect x="98"  y="50" width="15" height="70" rx="2" fill="url(#hubBars)"/>
      <rect x="119" y="30" width="15" height="90" rx="2" fill="#ffffff"/>
      <path d="M 34 132 C 72 124 108 100 142 52" fill="none" stroke="#6fb52c" stroke-width="12" stroke-linecap="round"/>
      <path d="M 160 24 L 128 38 L 147 55 Z" fill="#6fb52c"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" fill="#ffffff">
      <text x="800" y="600" font-size="26" font-weight="700">CEO Operating</text>
      <text x="800" y="630" font-size="26" font-weight="700">System<tspan font-size="14" dy="-10">&#8482;</tspan></text>
    </g>
  </g>

  <!-- ===== Hub -> framework connector ===== -->
  <g>
    <line x1="800" y1="685" x2="800" y2="742" stroke="#2178c4" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M788 738 L800 758 L812 738 Z" fill="#2178c4"/>
  </g>

  <!-- ===== Framework caption ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="800" y="800" font-size="16" font-weight="700" fill="#6fb52c" letter-spacing="1.5">THE PATH TO GROWTH</text>
  </g>

  <!-- ===== Framework stages ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <!-- Visibility -->
    <g>
      <rect x="120" y="830" width="300" height="116" rx="18" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <rect x="120" y="830" width="300" height="7" rx="3.5" fill="#4aa3e0"/>
      <text x="146" y="889" font-size="24" font-weight="700" fill="#13314f">Visibility</text>
      <text x="146" y="917" font-size="15" font-weight="400" fill="#6e6e73">Live KPIs &amp; executive</text>
      <text x="146" y="936" font-size="15" font-weight="400" fill="#6e6e73">dashboards</text>
    </g>
    <!-- Insights -->
    <g>
      <rect x="473" y="830" width="300" height="116" rx="18" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <rect x="473" y="830" width="300" height="7" rx="3.5" fill="#2e86c9"/>
      <text x="499" y="889" font-size="24" font-weight="700" fill="#13314f">Insights</text>
      <text x="499" y="917" font-size="15" font-weight="400" fill="#6e6e73">Profitability &amp; retention</text>
      <text x="499" y="936" font-size="15" font-weight="400" fill="#6e6e73">analysis</text>
    </g>
    <!-- Execution -->
    <g>
      <rect x="826" y="830" width="300" height="116" rx="18" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <rect x="826" y="830" width="300" height="7" rx="3.5" fill="#2178c4"/>
      <text x="852" y="889" font-size="24" font-weight="700" fill="#13314f">Execution</text>
      <text x="852" y="917" font-size="15" font-weight="400" fill="#6e6e73">Goal tracking &amp;</text>
      <text x="852" y="936" font-size="15" font-weight="400" fill="#6e6e73">accountability</text>
    </g>
    <!-- Growth -->
    <g>
      <rect x="1179" y="830" width="300" height="116" rx="18" fill="#ffffff" stroke="#e6ecf3" filter="url(#card)"/>
      <rect x="1179" y="830" width="300" height="7" rx="3.5" fill="#6fb52c"/>
      <text x="1205" y="889" font-size="24" font-weight="700" fill="#13314f">Growth</text>
      <text x="1205" y="917" font-size="15" font-weight="400" fill="#6e6e73">Revenue, retention &amp;</text>
      <text x="1205" y="936" font-size="15" font-weight="400" fill="#6e6e73">profit acceleration</text>
    </g>
    <!-- Stage arrows -->
    <g fill="url(#growthLine)">
      <path d="M433 879 L460 888 L433 897 Z"/>
      <path d="M786 879 L813 888 L786 897 Z"/>
      <path d="M1139 879 L1166 888 L1139 897 Z"/>
    </g>
  </g>

  <!-- ===== Tagline ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="800" y="1055" font-size="42" font-weight="700" fill="#13314f" letter-spacing="-0.5">Align Your Team. Accelerate Growth.</text>
    <rect x="640" y="1075" width="320" height="4" rx="2" fill="url(#growthLine)"/>
    <text x="800" y="1120" font-size="17" font-weight="500" fill="#6e6e73">Aligned KPIs&#8482; &#183; 1 to 100 Advisors, Inc.</text>
  </g>
</svg>
