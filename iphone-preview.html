<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>iPhone mockup — CEO Daily Pulse</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
    background: #f5f5f7; color: #1d1d1f;
  }
  .wrap { width: min(1100px, 100%); margin: 0 auto; }
  h1 {
    font-family: -apple-system, "SF Pro Display", sans-serif;
    font-weight: 600; letter-spacing: -0.02em; font-size: 32px; margin: 0 0 6px;
  }
  .lede { color: #6e6e73; margin: 0 0 40px; max-width: 60ch; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
  @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
  .card {
    border-radius: 24px; padding: 48px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 12px 36px rgba(0,0,0,0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 740px;
  }
  .card.light {
    background:
      radial-gradient(60% 50% at 50% 0%, #e7f0ff 0%, transparent 70%),
      linear-gradient(180deg, #ffffff, #f4f4f7);
  }
  .card.dark  {
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(33,120,196,0.30) 0%, transparent 70%),
      linear-gradient(180deg, #0b0b0d, #141417);
    color: #fff;
  }
  .card img { display: block; width: 280px; max-width: 100%; height: auto; }
  .label { margin-top: 22px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6e73; }
  .card.dark .label { color: rgba(255,255,255,0.6); }
  .sizes {
    margin-top: 40px;
    display: flex; align-items: flex-end; justify-content: center; gap: 32px;
    flex-wrap: wrap;
    padding: 36px 24px;
    background:
      radial-gradient(50% 70% at 50% 100%, rgba(111,181,44,0.20), transparent 70%),
      linear-gradient(180deg, #ffffff, #ebebef);
    border-radius: 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 12px 36px rgba(0,0,0,0.08);
  }
  .sizes img { display: block; height: auto; }
  .sizes .s1 { width: 160px; }
  .sizes .s2 { width: 220px; }
  .sizes .s3 { width: 300px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>iPhone mockup — CEO Daily Pulse</h1>
  <p class="lede">Single SVG, scales crisply at any size. Open these full-size and zoom in — the dashboard text and sparklines stay sharp.</p>

  <div class="row">
    <div class="card light">
      <img src="assets/iphone-ceo-daily-pulse.svg" alt="CEO Daily Pulse on iPhone, light background">
      <div class="label">on light background</div>
    </div>
    <div class="card dark">
      <img src="assets/iphone-ceo-daily-pulse.svg" alt="CEO Daily Pulse on iPhone, dark background">
      <div class="label">on dark background</div>
    </div>
  </div>

  <div class="sizes" aria-label="Size comparison">
    <img class="s1" src="assets/iphone-ceo-daily-pulse.svg" alt="small">
    <img class="s2" src="assets/iphone-ceo-daily-pulse.svg" alt="medium">
    <img class="s3" src="assets/iphone-ceo-daily-pulse.svg" alt="large">
  </div>
</div>
</body>
</html>
